name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis
          POSTGRES_DB: jarvisgram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jarvis" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jarvis:jarvis@localhost:5432/jarvisgram_test
      TEST_DATABASE_URL: postgresql://jarvis:jarvis@localhost:5432/jarvisgram_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @jarvisgram/web build
        env:
          WEB_PUBLIC_URL: http://localhost:3000
          MCP_PUBLIC_URL: http://localhost:3001
