<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvisgram — ofis simulyatsiyasi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#14161a;color:#eef0f3;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
.wrap{max-width:1500px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{margin:0;font-size:20px;flex:1 1 200px}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid #454b55;background:#1f2329;color:#eef0f3;font:inherit;cursor:pointer}
.chip.on{border-color:#f0a04b;color:#f0a04b;font-weight:600}
.stat{color:#b3bac5}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:auto}
.cmd{display:flex;flex-wrap:wrap;gap:8px}
.cmd input{flex:1 1 260px;height:48px;padding:0 14px;border-radius:10px;border:1px solid #454b55;background:#1f2329;color:#eef0f3;font:inherit}
.btn{height:48px;padding:0 18px;border-radius:10px;border:0;background:#f0a04b;color:#1a1206;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:#1f2329;color:#eef0f3;border:1px solid #454b55;font-weight:500}
.btn.sm{height:36px;padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:#1b1e24;border:1px solid #2e333b;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.card h2{margin:0;font-size:13px;letter-spacing:.04em;color:#b3bac5;font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #2a2e35}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.muted{color:#b3bac5;font-size:12px}
.bar{flex:0 0 70px;height:6px;border-radius:3px;background:#2e333b;overflow:hidden}
.bar i{display:block;height:100%;background:#6fb1ff}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;max-height:210px;overflow:auto;color:#d6dae0}
.log span{color:#f0a04b}
.empty{color:#b3bac5;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Jarvisgram · ofis</h1>
    <span class="stat" id="stat"></span>
    <span id="accs"></span>
    <button class="chip" id="spd" type="button">Tezlik: 1x</button>
    <button class="chip on" id="lbl" type="button">Ismlar</button>
  </header>
  <div class="stage"><canvas id="cv" width="2250" height="1116" role="img" aria-label="Ofis: Jarvis kabineti, ish stollari, majlis zali va dam olish xonasi"></canvas></div>
  <form class="cmd" id="form">
    <label for="inp" style="position:absolute;left:-9999px">Jarvisga buyruq</label>
    <input id="inp" type="text" autocomplete="off" placeholder="Jarvisga buyruq yozing, masalan: ertangi Reels'ni tayyorlang">
    <button class="btn" type="submit">Buyruq berish</button>
    <button class="btn ghost" type="button" data-q="Ertangi Reels'ni tayyorlang">Reels</button>
    <button class="btn ghost" type="button" data-q="Haftalik statistika hisobotini chiqaring">Hisobot</button>
    <button class="btn ghost" type="button" data-q="Yangi izohlarga javob tayyorlang">Izohlar</button>
    <button class="btn ghost" type="button" data-q="Karusel post tayyorlang">Karusel</button>
  </form>
  <div class="grid">
    <section class="card"><h2>VAZIFALAR</h2><div id="tasks"></div></section>
    <section class="card"><h2>TASDIQ KUTMOQDA</h2><div id="appr"></div></section>
    <section class="card"><h2>JONLI LOG</h2><div class="log" id="log"></div></section>
  </div>
</div>
<script>
(function(){
var S=3, cv=document.getElementById('cv'), g=cv.getContext('2d');
var img=new Image(); img.src='office.jpg';

/* ---------- yo'l grafi ---------- */
var N={}, E={};
function nid(x,y){return x+','+y}
function node(x,y){var k=nid(x,y); if(!N[k]){N[k]={x:x,y:y}; E[k]=[]} return k}
function link(a,b){ if(a===b) return; if(E[a].indexOf(b)<0){E[a].push(b); E[b].push(a)} }
function path(pts){ var prev=null; pts.forEach(function(p){ var k=node(p[0],p[1]); if(prev) link(prev,k); prev=k }); return prev }
function linkLine(axis,val,min,max){
  var o=axis==='y'?'x':'y', ks=Object.keys(N).filter(function(k){return N[k][axis]===val && N[k][o]>=min && N[k][o]<=max});
  ks.sort(function(a,b){return N[a][o]-N[b][o]});
  for(var i=1;i<ks.length;i++) link(ks[i-1],ks[i]);
}
var UY=155, LY=236;
var seats=[];
[124,165,243,284,363,409,487].forEach(function(x){ seats.push({k:path([[x,UY],[x,174]]),dir:1,mon:13}) });
[119,163,242,283,362,407,487].forEach(function(x){ seats.push({k:path([[x,LY],[x,219]]),dir:-1,mon:-20}) });
[[81,UY],[529,UY],[223,UY],[268,UY],[341,UY],[517,UY],[81,LY],[529,LY],[229,LY]].forEach(function(p){node(p[0],p[1])});
path([[81,UY],[81,LY]]); path([[529,UY],[529,LY]]);
var J_HOME=path([[223,UY],[223,120],[223,100],[168,96],[168,45],[127,45]]);
seats.push({k:path([[268,UY],[268,122],[311,118],[311,43],[282,43]]),dir:1,mon:14});
seats.push({k:path([[341,UY],[341,122],[407,118],[407,40],[380,40]]),dir:1,mon:15});
path([[517,UY],[517,100]]);
seats.push({k:path([[517,100],[499,96],[499,86]]),dir:-1,mon:-18});
seats.push({k:path([[499,96],[465,96],[465,86]]),dir:-1,mon:-18});
seats.push({k:path([[517,100],[517,42],[499,42],[499,50]]),dir:1,mon:8});
seats.push({k:path([[499,42],[465,42],[465,50]]),dir:1,mon:8});
/* majlis zali */
path([[529,UY],[553,149],[566,150]]);
var conf=[];
[70,84,98,112,126,140,154].forEach(function(y){ conf.push(path([[566,y],[579,y]])) });
node(566,47); node(566,186);
conf.push(path([[611,186],[611,176]])); conf.push(path([[630,186],[630,176]]));
node(668,186);
[154,140,126,112].forEach(function(y){ conf.push(path([[668,y],[656,y]])) });
var J_CONF=path([[566,47],[611,47]]);
linkLine('x',566,47,186); linkLine('y',186,566,668); linkLine('x',668,112,186);
/* dam olish xonasi */
path([[229,LY],[229,262],[205,280],[195,300],[195,326]]);
var lounge=[];
[112,131,150,169].forEach(function(x){ lounge.push(path([[x,326],[x,313]])) });
[124,146].forEach(function(x){ lounge.push(path([[x,326],[x,343]])) });
lounge.push(path([[97,326],[88,330]])); lounge.push(path([[97,326],[92,312],[71,311]]));
lounge.push(path([[180,326],[180,340]])); lounge.push(path([[186,326],[186,313]]));
lounge.push(path([[101,326],[101,340]])); lounge.push(node(160,326)); lounge.push(node(137,326));
linkLine('y',326,97,195); linkLine('y',UY,81,529); linkLine('y',LY,81,529);

function route(a,b){
  if(a===b) return [];
  var dist={}, prev={}, Q=Object.keys(N); Q.forEach(function(k){dist[k]=Infinity}); dist[a]=0;
  while(Q.length){
    var bi=0; for(var i=1;i<Q.length;i++) if(dist[Q[i]]<dist[Q[bi]]) bi=i;
    var u=Q.splice(bi,1)[0]; if(u===b||dist[u]===Infinity) break;
    E[u].forEach(function(v){ var d=dist[u]+Math.hypot(N[u].x-N[v].x,N[u].y-N[v].y); if(d<dist[v]){dist[v]=d; prev[v]=u} });
  }
  var out=[], c=b; while(c && c!==a){ out.unshift(c); c=prev[c] } return c===a?out:[];
}

/* ---------- agentlar ---------- */
var ROLES=['Kopirayter','Kopirayter 2','Montajer','Montajer 2','SMM-chi','SMM-chi 2','Analitik','Kommentator','Kommentator 2','Dizayner','Ssenarist','Xeshteg-chi','Trend-ovchi'];
var SHIRT=['#4d7cc9','#5b8f6a','#b5653f','#8a6fb8','#3f8f96','#c2884a','#6a7f99','#a3566b','#7a8c4a','#5670b0','#99703d','#4f8d7c','#8c5a8f'];
var HAIR=['#2a211c','#4a3323','#1b1b1d','#6b4a2f','#2f2a26'];
var WORK={'Kopirayter':'Caption yozish','Montajer':'Video montaj','SMM-chi':'Nashrni rejalashtirish','Analitik':'Statistika hisoboti','Kommentator':'Izohlarga javob qoralamasi','Dizayner':'Muqova dizayni','Ssenarist':'Ssenariy yozish','Xeshteg-chi':'Xeshteg tanlash','Trend-ovchi':'Trendlar tahlili'};
function base(r){return r.replace(/ \d+$/,'')}
var TALK={
 chill:['Choy ichamizmi?','Qahva zo\'r ekan','Bugun ish ko\'pmi?','Yangi trendni ko\'rdingmi?','Ha, ko\'rdim','Jarvis chaqirsa boramiz','Kecha Reels zo\'r chiqdi','Bir oz dam olaylik','Rostdanmi?','Menga ham quyib yubor'],
 call:['Ketyapman!','Majlisga!','Hozir boraman','Nima gap ekan?','Yuringlar','Bir daqiqa'],
 brief:['Tushunarli','Qachongacha?','Bo\'ldi, qilamiz','Savol yo\'q','Yaxshi g\'oya','Men tayyorman'],
 walk:['Boshladik','Ishga!','Tez tugataman'],
 'Kopirayter':['Hook topdim!','Caption deyarli tayyor','Sarlavhani o\'zgartiraman'],
 'Montajer':['Kadrni kesyapman','Subtitr qo\'yyapman','Musiqa mos tushdi'],
 'SMM-chi':['19:00 ga qo\'yaman','Jadvalga kiritdim','Stories ham kerak'],
 'Analitik':['Raqamlarni yig\'yapman','Qamrov o\'sibdi','Jadval tayyor bo\'lyapti'],
 'Kommentator':['Javob qoralayapman','Savollar ko\'p ekan','Muloyim javob yozdim'],
 'Dizayner':['Muqova rangini tanlayapman','Shrift mos keldi','Yana bir variant'],
 'Ssenarist':['Birinchi 3 soniya muhim','Ssenariy tayyor bo\'lyapti'],
 'Xeshteg-chi':['Xeshteglarni saralayapman','Bu teg yaxshi ishlaydi'],
 'Trend-ovchi':['Yangi trend chiqibdi','Bu audio ommalashyapti'],
 jarvis:['Rejani ko\'ryapman','Hisobotlar yaxshi','Keyingi vazifa kimga?']
};
function pick(k){ var l=TALK[k]||TALK.chill; return l[Math.floor(Math.random()*l.length)] }
function chat(a,text,sec,wait){ a.sayQ={t:text,s:sec||2.6,w:wait||0} }
var agents=ROLES.map(function(r,i){ var k=lounge[i]; return {role:r,shirt:SHIRT[i],hair:HAIR[i%HAIR.length],x:N[k].x,y:N[k].y,at:k,path:[],home:k,seat:-1,task:null,state:'chill',dir:1,ph:i*1.7,delay:0,say:'',sayT:0,talk:2+i*0.9} });
var jarvis={role:'JARVIS',suit:true,hair:'#1b1b1d',x:N[J_HOME].x,y:N[J_HOME].y,at:J_HOME,path:[],state:'cabinet',dir:1,ph:0,delay:0,say:'',sayT:0,talk:5};
var everyone=agents.concat([jarvis]);
var seatUsed=seats.map(function(){return false});
function go(a,target,delay){ var from=a.path.length?a.path[0]:a.at; var r=route(from,target); a.path=(a.path.length?[a.path[0]]:[]).concat(r); a.delay=delay||0 }
function freeSeat(){ for(var i=0;i<seats.length;i++) if(!seatUsed[i]) return i; return -1 }

/* ---------- holat ---------- */
var accs=['@akkaunt_1','@akkaunt_2','@akkaunt_3'], acc=0, speed=1, labels=true;
var queue=[], meeting=null, tasks=[], approvals=[], logs=[], simMin=9*60, taskId=0;
function clock(){ var m=Math.floor(simMin)%1440; return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2) }
function log(who,msg){ logs.unshift({t:clock(),who:who,msg:msg}); if(logs.length>60) logs.pop(); dirty=true }
function say(t,sec){ jarvis.say=t; jarvis.sayT=sec }
function rolesFor(q){
  q=q.toLowerCase();
  if(/reels|video|rolik|stories/.test(q)) return ['Ssenarist','Kopirayter','Montajer','SMM-chi'];
  if(/hisobot|statistik|analitik|tahlil/.test(q)) return ['Analitik','Trend-ovchi'];
  if(/izoh|koment|komment|dm|javob/.test(q)) return ['Kommentator'];
  if(/karusel|post|rasm|dizayn/.test(q)) return ['Kopirayter','Dizayner','Xeshteg-chi','SMM-chi'];
  return ['Kopirayter','SMM-chi','Analitik'];
}
function command(q){ q=q.trim(); if(!q) return; queue.push({q:q,acc:accs[acc]}); log('siz',q+' ('+accs[acc]+')'); }
function startMeeting(c){
  meeting={c:c,phase:'gather',t:0};
  say('Hamma majlis zaliga!',4); log('jarvis','hammani majlis zaliga chaqirdi');
  agents.forEach(function(a,i){ a.state='meeting'; go(a,conf[i],0.25*i); chat(a,pick('call'),2.4,0.3+Math.random()*2.5) });
  jarvis.state='meeting'; go(jarvis,J_CONF,0.6);
}
function endMeeting(){
  var c=meeting.c, need=rolesFor(c.q), picked=[];
  need.forEach(function(r){
    var cand=agents.filter(function(a){return base(a.role)===r && picked.indexOf(a)<0});
    var a=cand.filter(function(x){return !x.task})[0]; if(!a) return;
    picked.push(a);
    a.task={id:++taskId,name:WORK[r],acc:c.acc,dur:22+Math.random()*18,prog:0,role:a.role,cmd:c.q}; tasks.push(a.task);
    log('jarvis',a.role+' ← '+WORK[r]); chat(a,'Men olaman!',2.6,0.3*picked.length);
  });
  if(!picked.length) log('jarvis','kerakli agentlar band, vazifa navbatga qaytdi'), queue.push(c);
  agents.forEach(function(a,i){
    if(a.task){ if(a.seat<0){ a.seat=freeSeat(); if(a.seat>=0) seatUsed[a.seat]=true } a.state='toDesk'; go(a,a.seat>=0?seats[a.seat].k:a.home,0.2*i) }
    else { a.state='chill'; go(a,a.home,0.2*i) }
  });
  jarvis.state='cabinet'; go(jarvis,J_HOME,1.5); say('Ishga!',3);
  meeting=null;
}
function finish(a){
  var t=a.task; tasks.splice(tasks.indexOf(t),1); approvals.push({id:t.id,role:a.role,name:t.name,acc:t.acc});
  log(a.role.toLowerCase(),t.name+' tayyor, tasdiq kutmoqda');
  if(a.seat>=0){ seatUsed[a.seat]=false; a.seat=-1 } a.task=null; a.state='chill'; go(a,a.home,0); chat(a,'Tayyor!',2.8,0);
}

/* ---------- yangilash ---------- */
function step(dt){
  simMin+=dt*0.5;
  everyone.forEach(function(a){
    if(a.delay>0){ a.delay-=dt; return }
    var left=38*dt;
    while(a.path.length && left>0){
      var n=N[a.path[0]], dx=n.x-a.x, dy=n.y-a.y, d=Math.hypot(dx,dy);
      if(d<=left){ a.x=n.x; a.y=n.y; a.at=a.path.shift(); left-=d }
      else { a.x+=dx/d*left; a.y+=dy/d*left; if(Math.abs(dy)>Math.abs(dx)) a.dir=dy>0?1:-1; left=0 }
      a.moving=true;
    }
    if(!a.path.length) a.moving=false;
    if(a.sayT>0){ a.sayT-=dt; if(a.sayT<=0) a.say='' }
    if(a.sayQ){ a.sayQ.w-=dt; if(a.sayQ.w<=0){ a.say=a.sayQ.t; a.sayT=a.sayQ.s; a.sayQ=null; a.talk=5+Math.random()*8 } }
    a.talk-=dt;
    if(a.talk<=0){ a.talk=6+Math.random()*11;
      if(!a.say && !a.sayQ){ var k=a.suit?(a.state==='cabinet'?'jarvis':null):a.state==='working'?base(a.role):a.state==='chill'&&!a.moving?'chill':a.state==='toDesk'?'walk':null;
        if(k){ a.say=pick(k); a.sayT=2.6 } } }
  });
  agents.forEach(function(a){
    if(a.task && !a.path.length && a.state==='toDesk'){ a.state='working'; if(a.seat>=0) a.dir=seats[a.seat].dir; log(a.role.toLowerCase(),'ish boshladi: '+a.task.name) }
    if(a.state==='working'){ a.task.prog+=dt/a.task.dur; dirty=true; if(a.task.prog>=1) finish(a) }
  });
  if(meeting){
    if(meeting.phase==='gather'){
      var all=everyone.every(function(a){return !a.path.length});
      if(all){ meeting.phase='brief'; meeting.t=6; say(meeting.c.q+' · '+meeting.c.acc,6); log('jarvis','vazifani tushuntirmoqda'); agents.forEach(function(a){ if(Math.random()<0.6) chat(a,pick('brief'),2.4,1.5+Math.random()*3.5) }) }
    } else { meeting.t-=dt; if(meeting.t<=0) endMeeting() }
  } else if(queue.length){ startMeeting(queue.shift()) }
}

/* ---------- chizish ---------- */
function person(a,t){
  var x=a.x*S, y=a.y*S, bob=a.moving?Math.sin(t*11+a.ph)*0.12:0;
  g.save(); g.translate(x,y); g.scale(1.3,1.3); g.translate(-x,-y);
  g.fillStyle='rgba(0,0,0,.38)'; g.beginPath(); g.ellipse(x+3,y+7,19,12,0,0,7); g.fill();
  g.save(); g.translate(x,y); g.rotate(bob);
  g.fillStyle=a.suit?'#1a2030':a.shirt; g.beginPath(); g.ellipse(0,0,17,11,0,0,7); g.fill();
  g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=1.5; g.stroke();
  if(a.suit){ g.fillStyle='#f4f4f1'; g.beginPath(); g.moveTo(-5,a.dir*2); g.lineTo(5,a.dir*2); g.lineTo(0,a.dir*10); g.fill(); g.fillStyle='#a02525'; g.fillRect(-1.5,a.dir>0?3:-9,3,6) }
  g.restore();
  g.fillStyle='#e3b48f'; g.beginPath(); g.arc(x,y-3+a.dir*2.5,9,0,7); g.fill();
  g.fillStyle=a.hair; g.beginPath(); g.arc(x,y-3,9.5,0,7); g.fill();
  g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=1; g.stroke();
  g.restore();
}
function pill(text,x,y,bg,fg,size){
  g.font='600 '+size+'px system-ui,sans-serif'; var w=g.measureText(text).width+16, h=size+10;
  x=Math.max(w/2+4,Math.min(cv.width-w/2-4,x));
  g.fillStyle=bg; g.beginPath(); if(g.roundRect) g.roundRect(x-w/2,y-h,w,h,h/2); else g.rect(x-w/2,y-h,w,h); g.fill();
  g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,x,y-h/2+1);
}
function bubble(text,x,y,size){
  g.font='600 '+size+'px system-ui,sans-serif'; var w=g.measureText(text).width+22, h=size+14;
  var cx=Math.max(w/2+4,Math.min(cv.width-w/2-4,x)), top=Math.max(4,y-h-10);
  g.fillStyle='#ffffff'; g.strokeStyle='#14161a'; g.lineWidth=2.5;
  g.beginPath(); if(g.roundRect) g.roundRect(cx-w/2,top,w,h,h/2); else g.rect(cx-w/2,top,w,h); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x-7,top+h-1.5); g.lineTo(x,top+h+11); g.lineTo(x+7,top+h-1.5); g.fill();
  g.beginPath(); g.moveTo(x-7,top+h); g.lineTo(x,top+h+11); g.lineTo(x+7,top+h); g.stroke();
  g.fillStyle='#14161a'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,cx,top+h/2+1);
}
function draw(t){
  if(img.complete && img.naturalWidth) g.drawImage(img,0,0,cv.width,cv.height); else { g.fillStyle='#3a342e'; g.fillRect(0,0,cv.width,cv.height) }
  /* peshtaxta yozuvi */
  g.fillStyle='#35271d'; g.fillRect(310*S,258*S,68*S,27*S);
  g.fillStyle='#f1e6d2'; g.font='700 40px system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('JARVISGRAM',344*S,271.5*S);
  /* yonib turgan monitorlar */
  agents.forEach(function(a){ if(a.state!=='working'||a.seat<0) return; var s=seats[a.seat], p=N[s.k], mx=p.x*S, my=(p.y+s.mon)*S, f=0.85+0.15*Math.sin(t*9+a.ph);
    g.save(); g.shadowColor='rgba(140,200,255,.95)'; g.shadowBlur=34; g.fillStyle='rgba(190,228,255,'+f+')'; g.fillRect(mx-15,my-6,30,12); g.fillRect(mx-15,my-6,30,12); g.restore();
    g.fillStyle='rgba(60,120,200,.55)'; g.fillRect(mx-11,my-3,14,2); g.fillRect(mx-11,my+1,20,2) });
  /* majlis zali ekrani */
  if(meeting){ var on=0.85+0.15*Math.sin(t*5);
    g.save(); g.shadowColor='rgba(120,190,255,.95)'; g.shadowBlur=50; g.fillStyle='rgba(70,150,255,'+on+')'; g.fillRect(582*S,23*S,53*S,12*S); g.restore();
    g.fillStyle='#ffffff'; g.font='700 20px system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(meeting.phase==='brief'?'VAZIFA · '+meeting.c.acc:'MAJLIS',608.5*S,29*S) }
  var list=everyone.slice().sort(function(a,b){return a.y-b.y});
  list.forEach(function(a){ person(a,t) });
  list.forEach(function(a){
    var x=a.x*S, y=a.y*S-27;
    if(a.state==='working'){ g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(x-22,y-8,44,7); g.fillStyle='#6fb1ff'; g.fillRect(x-22,y-8,44*Math.min(1,a.task.prog),7); y-=12 }
    if(a.suit){ pill('JARVIS',x,y,'#f0a04b','#1a1206',20); y-=32 }
    else if(labels && !a.say && !a.moving && a.state!=='meeting'){ pill(a.role,x,y,'rgba(15,17,20,.78)','#ffffff',17) }
    a.by=y;
  });
  list.forEach(function(a){ if(a.say) bubble(a.say,a.x*S,a.by,a.suit?24:20) });
  pill(clock(),cv.width-70,cv.height-14,'rgba(15,17,20,.78)','#ffffff',22);
}

/* ---------- panel ---------- */
var dirty=true;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
  dirty=false;
  var w=agents.filter(function(a){return a.state==='working'}).length, m=meeting?' · majlis ketmoqda':'';
  document.getElementById('stat').textContent=clock()+' · kompyuterda '+w+'/20 · dam olishda '+agents.filter(function(a){return a.state==='chill'}).length+m;
  document.getElementById('tasks').innerHTML=tasks.length?tasks.map(function(t){return '<div class="row"><div style="flex:1"><b>'+esc(t.role)+'</b><div class="muted">'+esc(t.name)+' · '+esc(t.acc)+'</div></div><div class="bar"><i style="width:'+Math.round(Math.min(1,t.prog)*100)+'%"></i></div></div>'}).join(''):'<div class="empty">Hozircha vazifa yo\'q. Jarvisga buyruq bering.</div>';
  document.getElementById('appr').innerHTML=approvals.length?approvals.map(function(p){return '<div class="row"><div style="flex:1"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.role)+' · '+esc(p.acc)+'</div></div><button class="btn sm" type="button" data-ok="'+p.id+'">Tasdiqlash</button></div>'}).join(''):'<div class="empty">Tasdiqlanadigan ish yo\'q.</div>';
  document.getElementById('log').innerHTML=logs.map(function(l){return '<div>'+l.t+' <span>'+esc(l.who)+'</span> '+esc(l.msg)+'</div>'}).join('');
}
function renderAccs(){ document.getElementById('accs').innerHTML=accs.map(function(a,i){return '<button class="chip'+(i===acc?' on':'')+'" type="button" data-acc="'+i+'">'+a+'</button>'}).join(' ') }
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.q) command(b.dataset.q);
  if(b.dataset.acc){ acc=+b.dataset.acc; renderAccs(); log('chrome',accs[acc]+' ga o\'tildi') }
  if(b.dataset.ok){ var id=+b.dataset.ok; approvals=approvals.filter(function(p){ if(p.id===id){ log('siz',p.name+' tasdiqlandi'); return false } return true }); dirty=true }
  if(b.id==='spd'){ speed=speed===1?2:speed===2?4:1; b.textContent='Tezlik: '+speed+'x' }
  if(b.id==='lbl'){ labels=!labels; b.classList.toggle('on',labels) }
});
document.getElementById('form').addEventListener('submit',function(e){ e.preventDefault(); var i=document.getElementById('inp'); command(i.value); i.value='' });

var last=0, acct=0;
function frame(ms){
  var t=ms/1000, dt=Math.min(0.05,t-last); last=t;
  for(var i=0;i<speed;i++) step(dt);
  draw(t);
  acct+=dt; if(dirty||acct>1){ acct=0; render() }
  requestAnimationFrame(frame);
}
renderAccs(); log('jarvis','ofis ochildi, 13 agent dam olish xonasida');
window.__sim={command:command,nodes:N};
requestAnimationFrame(frame);
})();
</script>
