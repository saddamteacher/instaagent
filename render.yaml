# Render Blueprint: Postgres + MCP server + veb-ilova.
# Deploydan keyin: jarvisgram-web'da MCP_PUBLIC_URL va WEB_PUBLIC_URL, jarvisgram-mcp'da WEB_PUBLIC_URL ni
# haqiqiy (yoki o'z domeningiz) manzillarga o'rnating. "jarvisgram-secrets" guruhida TOKEN_ENCRYPTION_KEY
# (openssl rand -base64 32) va Instagram ilovasi ma'lumotlarini kiriting — ikkala servis bir xil qiymatni oladi.
envVarGroups:
  - name: jarvisgram-secrets
    envVars:
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: IG_GRAPH_VERSION
        value: v26.0

databases:
  - name: jarvisgram-db
    databaseName: jarvisgram
    plan: basic-256mb

services:
  - type: web
    name: jarvisgram-mcp
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm db:deploy
    startCommand: pnpm --filter @jarvisgram/mcp start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: jarvisgram-db, property: connectionString }
      - key: WEB_PUBLIC_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - fromGroup: jarvisgram-secrets

  - type: web
    name: jarvisgram-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jarvisgram/web build
    startCommand: pnpm --filter @jarvisgram/web start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: jarvisgram-db, property: connectionString }
      - key: WEB_PUBLIC_URL
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - fromGroup: jarvisgram-secrets
